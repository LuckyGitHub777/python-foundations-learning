name: Verify public Python learning edition

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-foundations-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact original payload manifest
        run: sha256sum --check --strict SOURCE-MANIFEST.sha256
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify offline chapter interactions
        run: node --test tests/studio.test.mjs
      - name: Verify offline educational boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          script = Path("app.js").read_text(encoding="utf-8")
          css = Path("styles.css").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")
          assert 'connect-src \'none\'' in html
          assert 'script-src \'self\'' in html
          assert 'style-src \'self\'' in html
          assert 'id="studio"' in html
          assert 'Illustrative output' in html
          assert 'not a Python interpreter' in readme
          assert 'No account, tracking' in readme
          assert 'fetch(' not in script
          assert 'XMLHttpRequest' not in script
          for text in (html, css, script):
              assert 'https://' not in text and 'http://' not in text
          print("Offline learning boundary: OK")
          PY
